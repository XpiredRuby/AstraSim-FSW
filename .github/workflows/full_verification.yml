name: Full Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          python -m pip install --requirement requirements-ci.txt

      - name: Run full verification suite
        id: verification
        run: python tools/run_all_scenarios.py

      - name: Generate provenance manifest
        if: always()
        run: |
          status=failed
          if [ "${{ steps.verification.outcome }}" = "success" ]; then
            status=passed
          fi
          python tools/generate_baseline_manifest.py \
            --output reports/latest/baseline_manifest.json \
            --verification-status "$status" \
            --test-command "python tools/run_all_scenarios.py" \
            --build-type Release \
            --warnings-as-errors \
            --note "Generated by the Full Verification GitHub Actions workflow."

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: astra-os-full-verification-${{ github.run_id }}
          path: |
            reports/
            evidence/
            dist/
          if-no-files-found: warn
          retention-days: 30
